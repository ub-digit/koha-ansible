---
- hosts: all
  become: true
  become_user: root
  tasks:
    - name: Set facts
      ansible.builtin.set_fact:
        koha_plugins_dir: "{{ ['/var/lib/koha', koha_instance_name, 'plugins'] | path_join }}" 

#    - name: Include plugins list
#      ansible.builtin.include_vars:
#        file: plugins.yml
#        file: "{{ [koha_repo_path, 'koha_deploy/plugins.yaml'] | path_join }}"
#        name: koha_plugins

    - name: Ensure koha plugins
      ansible.builtin.shell: |
        set -exo pipefail
        mkdir -p "{{ clone_dir }}"

        git clone --depth 1 --branch "{{ item.branch }}" --bare "{{ item.url }}" "{{ clone_dir }}"
        git --git-dir "{{ clone_dir }}" archive "{{ item.branch }}" Koha | tar -x -f - -C "{{ koha_plugins_dir }}"
        rm -Rf {{ clone_dir }}
      loop: "{{ koha_plugins }}"
      vars:
        clone_dir: "/tmp/plugin"
