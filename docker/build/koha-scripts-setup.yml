---
- hosts: all
  become: true
  become_user: root
  vars_files:
    - ./vars/scripts.yml
    - ./vars/shared.yml
  tasks:

    # Edifact
    - name: Install required packages for upload edifact
      apt:
        name: ftp
        state: latest
        update_cache: yes

    - name: Checkout koha edifact repo
      ansible.builtin.git:
        repo: https://github.com/ub-digit/koha-edifact.git
        depth: 1
        dest: "{{ edifact_repo_path }}"
        version: "{{ edifact_git_revision }}"

    - name: Ensure test vendor directory
      ansible.builtin.file:
        dest: "{{ [edifact_repo_path, 'vendors', 'test'] | path_join }}"
        state: directory
        recurse: true
        owner: "{{ koha_user }}"
        group: "{{ koha_user }}"


    - name: Ensure default upload_edi.conf.yml
      ansible.builtin.template:
        src: "upload_edi.conf.yml.j2"
        dest: "{{ [edifact_repo_path, 'upload_edi.conf.yml'] | path_join }}"
        owner: "{{ koha_user }}"
        group: "{{ koha_user }}"

    # Print notice
    - name: Checkout print notice repo
      ansible.builtin.git:
        repo: https://github.com/ub-digit/koha-print-notice.git
        depth: 1
        dest: "{{ print_notice_repo_path }}"
        version: "{{ print_notice_git_revision }}"

    - name: Ensure print_notice.conf
      ansible.builtin.template:
        src: print-notice.conf.tpl.j2
        dest: "{{ [print_notice_repo_path, 'print-notice.conf.tpl'] | path_join }}"
        owner: "{{ koha_user }}"
        group: "{{ koha_user }}"

    # Gobi
    - name: Install gobi import perl dependecies
      community.general.cpanm:
        name: "{{ item }}"
      become: yes
      loop:
        - Email::MIME
        - Email::Sender::Simple
        - IO::All
        - Params::ValidationCompiler

    - name: Checkout gobi repo
      ansible.builtin.git:
        repo: https://github.com/ub-digit/koha-gobi-import.git
        depth: 1
        dest: "{{ gobi_import_repo_path }}"
        version: "{{ gobi_import_git_revision }}"

    - name: Ensure loadgobi.sh.conf
      template:
        src: loadgobi.sh.conf.tpl.j2
        dest: "{{ [gobi_import_repo_path, 'loadgobi.sh.conf.tpl'] | path_join }}"

    - name: Ensure log4perl.conf
      template:
        src: gobi.log4perl.conf.tpl.j2
        dest: "{{ [gobi_import_repo_path, 'log4perl.conf.tpl'] | path_join }}"

    # Loadlibris
    - name: Checkout loadlibris repo
      ansible.builtin.git:
        repo: https://github.com/ub-digit/loadlibris.git
        depth: 1
        dest: "{{ loadlibris_repo_path }}"
        version: "{{ loadlibris_git_revision }}"

    - name: Ensure loadlibris.sh.conf
      template:
        src: loadlibris.sh.conf.tpl.j2
        dest: "{{ [loadlibris_repo_path, 'loadlibris.sh.conf.tpl'] | path_join }}"

    # Fetchlibris
    - name: Install required packages for fetchlibris
      apt:
        name: ncftp
        state: latest
        update_cache: yes
      become: yes

    - name: Checkout fetchlibris repo
      ansible.builtin.git:
        repo: https://github.com/ub-digit/fetchlibris.git
        dest: "{{ fetchlibris_repo_path }}"
        version: "{{ fetchlibris_git_revision }}"

    - name: Ensure fetchlibris.sh.conf
      template:
        src: fetchlibris.sh.conf.tpl.j2
        dest: "{{ [fetchlibris_repo_path, 'fetchlibris.sh.conf.tpl'] | path_join }}"

    # Libris oai import
    - name: Checkout libris oai import repo
      ansible.builtin.git:
        repo: https://github.com/ub-digit/libris-oai-import.git
        depth: 1
        dest: "{{ libris_oai_import_repo_path }}"
        version: "{{ libris_oai_import_git_revision }}"

    - name: Ensure export_nix.sh.conf
      template:
        src: export_nix.sh.conf.tpl.j2
        dest: "{{ [libris_oai_import_repo_path, 'export_nix.sh.conf.tpl'] | path_join }}"

    # Papercut
    - name: Install required packages for papercut
      apt:
        name: mutt
        state: latest
        update_cache: yes
      become: yes

    - name: Checkout papercut repo
      ansible.builtin.git:
        repo: https://github.com/ub-digit/koha-papercut.git
        depth: 1
        dest: "{{ papercut_repo_path }}"
        version: "{{ papercut_git_revision }}"

    - name: Ensure papercut config
      template:
        src: papercut.config.tpl.j2
        dest: "{{ [papercut_repo_path, 'config.tpl'] | path_join }}"

    # Primo export
    - name: Checkout primo export repo
      ansible.builtin.git:
        repo:  https://github.com/ub-digit/koha-primo-export.git
        depth: 1
        dest: "{{ primo_export_repo_path }}"
        version: "{{ primo_export_git_revision }}"
